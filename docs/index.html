<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=../dashboard_ui/index.html">
    <title>Paramount Merchant Navy CRM System</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #1a237e 0%, #0d1642 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            color: white;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        .logo {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #ffd700;
        }
        p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 215, 0, 0.3);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #ffd700;
            text-decoration: none;
            border-bottom: 1px dashed #ffd700;
        }
        a:hover {
            border-bottom-style: solid;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">⚓</div>
        <h1>Paramount Merchant Navy</h1>
        <p>Sales Operations CRM System</p>
        <div class="loading">
            <div class="spinner"></div>
            <span>Redirecting to Dashboard...</span>
        </div>
        <p style="margin-top: 40px; font-size: 0.9rem;">
            If you are not redirected automatically, 
            <a href="../dashboard_ui/index.html">click here</a>.
        </p>
    </div>
    
    <script>
        // Fallback redirect if meta refresh doesn't work
        setTimeout(function() {
            window.location.href = '../dashboard_ui/index.html';
        }, 2000);
    </script>
</body>
</html>
